pre-commit:
  parallel: true
  commands:
    biome:
      glob: "website/**/*.{ts,tsx,js,json,astro}"
      run: pnpm exec biome check --error-on-warnings {staged_files}
    typecheck:
      glob: "website/**/*.{ts,tsx,js,mjs,json,astro}"
      run: pnpm --dir website check
    csharpier:
      glob: "**/*.cs"
      run: dotnet csharpier check {staged_files}

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
