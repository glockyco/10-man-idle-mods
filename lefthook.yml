pre-commit:
  parallel: true
  commands:
    biome:
      glob: "website/**/*.{ts,tsx,js,json,astro}"
      run: pnpm exec biome check {staged_files}
    csharpier:
      glob: "**/*.cs"
      run: dotnet csharpier check {staged_files}

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
